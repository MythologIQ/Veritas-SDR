name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Review C3: machine-enforced supply-chain gate. Advisories (RUSTSEC), the
  # C.O.R.E. forbidden-dependency bans, license allowlist, and registry pinning
  # all live in core-runtime/deny.toml.
  supply-chain:
    name: cargo-deny (advisories, bans, licenses, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: core-runtime/Cargo.toml

  lint:
    name: fmt + clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: core-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core-runtime
      - name: Formatting gate
        run: cargo fmt --check
      - name: Lint gate (issue #54 surface on unix runners)
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: core-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core-runtime
      - name: Test suite (default features)
        run: cargo test --workspace

  features:
    name: features / ${{ matrix.feature }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        feature: [gguf, onnx, ffi, python, advanced]
    defaults:
      run:
        working-directory: core-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core-runtime
      - name: Set up Python (python bindings link libpython)
        if: matrix.feature == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install protoc (candle-onnx builds protobuf via prost-build)
        if: matrix.feature == 'onnx'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Clippy gate (${{ matrix.feature }})
        run: cargo clippy --features ${{ matrix.feature }} --all-targets -- -D warnings
      - name: Test suite (${{ matrix.feature }})
        run: cargo test --features ${{ matrix.feature }}

  # B-34: perf baseline + bench smoke gate. Runs the CI-safe (model-free, GPU-free,
  # default-feature) benches so they cannot silently rot; fails on compile error or
  # bench panic. The criterion output is uploaded as the run's baseline record. The
  # timing-regression threshold (run-over-run cache + critcmp) is B-34b.
  bench:
    name: bench (default-feature, CI-safe set)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: core-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core-runtime
      # B-34b: on PRs, restore the most recent main baseline (same runner class) so the
      # gate below can compare. Cache paths are repo-root-relative (not working-directory).
      - name: Restore perf baseline (PR)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: core-runtime/perf-baseline
          key: criterion-baseline-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            criterion-baseline-${{ runner.os }}-
      - name: Perf benches (default-feature, CI-safe set)
        run: |
          cargo bench \
            --bench ipc_throughput --bench scheduler_throughput --bench concurrent_load \
            --bench memory_overhead --bench kv_cache_throughput \
            --bench generation_throughput --bench inference_latency \
            --bench security_overhead --bench scheduler_queue_overhead \
            --bench prompt_cache_overhead \
            -- --warm-up-time 1 --measurement-time 2 --sample-size 10
      # B-34b: fail the PR if any bench's median regressed > 2.0x vs the main baseline.
      # Generous by design (trimmed criterion is noisy); a cache miss skips-and-passes.
      - name: Perf regression gate (PR)
        if: github.event_name == 'pull_request'
        run: python3 scripts/perf_gate.py perf-baseline target/criterion 2.0
      # B-34b: refresh the cached baseline for future PRs on every push to main.
      - name: Save perf baseline (main)
        if: github.event_name == 'push'
        run: cp -r target/criterion perf-baseline
      - name: Cache perf baseline (main)
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: core-runtime/perf-baseline
          key: criterion-baseline-${{ runner.os }}-${{ github.sha }}
      - name: Upload criterion baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-baseline
          path: core-runtime/target/criterion
          if-no-files-found: warn
