# cargo-deny configuration — machine-enforces the supply-chain rules that were
# previously only prose (CLAUDE.md "Forbidden Dependencies", Cargo.toml comment
# block). Run locally with `cargo deny check` from core-runtime/; CI runs it in
# the rust.yml `supply-chain` job.

[graph]
# Check every feature combination that ships; GPU features resolve extra crates.
all-features = true

[advisories]
# RUSTSEC advisory database. Fail on any vulnerability; surface unmaintained /
# unsound crates as errors too — this crate ships crypto and a sandbox, so
# "someone else will notice" is not a strategy (see B-30/B-31 history: pyo3 and
# rand advisories were caught late precisely because nothing scanned).
version = 2
yanked = "deny"
ignore = [
    # paste is unmaintained (archived by its author); pulled transitively by
    # candle-core and tokenizers with no safe upgrade available. Revisit when
    # migrating candle 0.8 -> 0.11 / tokenizers 0.21 -> 0.23.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained transitive dep of candle/tokenizers; no upgrade exists; revisit on the candle 0.11 migration" },
]

[bans]
# Duplicate-version drift is common in the ML dep tree; warn, don't fail.
multiple-versions = "warn"

# C.O.R.E. "Offline" boundary: no network stack may enter the dependency graph.
# This encodes the forbidden-dependency list from CLAUDE.md / Cargo.toml.
deny = [
    # HTTP clients / servers
    { crate = "reqwest", reason = "C.O.R.E. Offline boundary: no network access" },
    { crate = "hyper", reason = "C.O.R.E. Offline boundary: no network access" },
    { crate = "hyper-util", reason = "C.O.R.E. Offline boundary: no network access" },
    { crate = "ureq", reason = "C.O.R.E. Offline boundary: no network access" },
    { crate = "curl", reason = "C.O.R.E. Offline boundary: no network access" },
    { crate = "isahc", reason = "C.O.R.E. Offline boundary: no network access" },
    { crate = "attohttpc", reason = "C.O.R.E. Offline boundary: no network access" },
    # WebSockets
    { crate = "tungstenite", reason = "C.O.R.E. Offline boundary: no WebSocket libraries" },
    { crate = "tokio-tungstenite", reason = "C.O.R.E. Offline boundary: no WebSocket libraries" },
    { crate = "async-tungstenite", reason = "C.O.R.E. Offline boundary: no WebSocket libraries" },
    { crate = "websocket", reason = "C.O.R.E. Offline boundary: no WebSocket libraries" },
    # Model-hub / download clients (would smuggle in HTTP)
    { crate = "hf-hub", reason = "C.O.R.E. Offline boundary: no model download paths" },
    # Filesystem traversal (Restricted boundary: models/ + tokenizers/ read,
    # temp/ + cache/ write, deny all else — traversal libs invite violations)
    # walkdir allowed only inside: criterion (dev-dependency; benches never
    # ship), llama-cpp-sys-2 (build script walks the vendored llama.cpp source
    # tree), and sysctl (BSD sysfs reading inside the llama.cpp sys stack).
    { crate = "walkdir", reason = "C.O.R.E. Restricted boundary: no filesystem traversal libraries", wrappers = ["criterion", "llama-cpp-sys-2", "sysctl"] },
    { crate = "globwalk", reason = "C.O.R.E. Restricted boundary: no filesystem traversal libraries" },
    # `glob` is allowed ONLY where build-time toolchain discovery drags it in
    # transitively (clang-sys locates libclang for bindgen; llama-cpp-sys-2
    # globs source trees in its build script; find_cuda_helper locates the CUDA
    # toolkit). It must never become a direct or runtime dependency.
    { crate = "glob", reason = "C.O.R.E. Restricted boundary: no filesystem traversal libraries", wrappers = ["clang-sys", "llama-cpp-sys-2", "find_cuda_helper"] },
]

[licenses]
# The crate is Apache-2.0; keep the graph to permissive, compatible licenses.
allow = [
    "MIT",
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
